[package]
name         = "bentodesk-theme"
description  = "Theme tokens (palette/spacing/radius/shadow/typo) + observer for BentoDesk."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bentodesk-style = { path = "../bentodesk-style" }
bentodesk-tree  = { path = "../bentodesk-tree" }
smol_str         = { workspace = true }
smallvec         = { workspace = true }
# Forces `serde`'s `alloc` feature on for isolated `cargo test -p bentodesk-theme`
# builds. `smol_str` (pulled directly) activates `smol_str/serde`, but
# `serde_core::de::Visitor`'s `visit_string`/`visit_byte_buf` are alloc-gated;
# without serde/alloc unified in, smol_str 0.3.6's serde impl fails to compile
# (E0407). Identical fix already applied to bentodesk-layout / bentodesk-widget.
serde            = { workspace = true }

[lints]
workspace = true
