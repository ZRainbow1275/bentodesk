[package]
name         = "bento-nano-tree"
description  = "Arena-allocated widget tree for BentoDesk Nano."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bento-nano-style = { path = "../bento-nano-style" }
smol_str = { workspace = true }
smallvec = { workspace = true }
# Forces `serde`'s `alloc` feature on for isolated `cargo test -p bento-nano-tree`
# builds. `smol_str` (pulled directly) activates `smol_str/serde`, but
# `serde_core::de::Visitor`'s `visit_string`/`visit_byte_buf` are alloc-gated;
# without serde/alloc unified in, smol_str 0.3.6's serde impl fails to compile
# (E0407). Identical fix already applied to bento-nano-layout / bento-nano-widget.
serde = { workspace = true }

[lints]
workspace = true
