[package]
name         = "bentodesk-platform"
description  = "Win32 + D2D + DComp + DWrite low-level platform layer for BentoDesk."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
windows-sys       = { workspace = true }
windows           = { workspace = true }
smol_str          = { workspace = true }
smallvec          = { workspace = true }
crossbeam-channel = { workspace = true }
bentodesk-zone   = { path = "../bentodesk-zone" }
# ΔB ruling (master-decomposition §11): WindowKind flows through the
# dispatcher Command surface (Show/HideWindow variants in bentodesk-app),
# so it derives serde even though the single-process build never serializes
# at runtime — preserves the v2.x scripting/plugin shape at zero runtime cost.
serde             = { workspace = true }
# Wave 19 — direct binding to mimalloc options API (`mi_option_set`/`_get`).
# Not a new crate in the dep graph: `libmimalloc-sys` is already a transitive
# of the `mimalloc` workspace dep used by the shell binary (`bentodesk-shell`).
# Adding it here as a direct dep just lets `crate::allocator` call those
# symbols without routing through the `MiMalloc` wrapper. No spec §8 movement
# (mimalloc is the sanctioned allocator).
libmimalloc-sys   = { version = "0.1.47", default-features = false, features = ["extended"] }

[features]
# Wave 17 update (2026-05-02) — the Wave 13 ablation claim that flipping
# `acrylic` OFF *increased* Private Bytes by ~11 MB has been **invalidated**.
# Wave 16 forensics discovered that the pre-Wave-16 measurement baseline was
# degenerate: the DComp v3 cast was returning `E_NOINTERFACE`, so `paint()`
# returned `Err` every frame and the renderer never executed a real D2D draw
# call. The "+11 MB on OFF" reading was a measurement artifact, not signal.
#
# Wave 17 re-ran the ablation against the valid Wave 16 baseline and measured
# the actual cost: **acrylic OFF saves only ~1.02 MB PB** (3-run median; see
# `extreme-memory-reduction.md` Wave 17 section for the per-run table).
#
# Default remains `acrylic` because:
#   (a) the cost is noise-level (~1 MB ≈ measurement jitter on this rig);
#   (b) the Wave 16 `device3: Option<IDCompositionDevice3>` fallback means
#       acrylic gracefully degrades on hardware where DComp v3 is unavailable
#       (current iGPU build path), making the feature flag conditionally-live
#       — not statically-dead — and worth keeping default-on for visual
#       fidelity at near-zero memory cost.
default = ["acrylic"]
# In-app `IDCompositionGaussianBlurEffect` chain. Default-on per Wave 17
# corrected ablation (Wave 13 result superseded). See
# `.trellis/tasks/04-30-phase-0-d2d-spike/research/extreme-memory-reduction.md`
# Wave 17 section for measurement methodology and per-run data.
acrylic = []
# Default-off; D2D shadow effect (CLSID_D2D1Shadow) — adds ~200 KB binary.
shadow  = []

[lints]
workspace = true
