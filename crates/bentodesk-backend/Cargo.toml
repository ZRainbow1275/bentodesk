[package]
name         = "bentodesk-backend"
description  = "Lift-verbatim Win32 backend modules ported from BentoDesk 1.x src-tauri/src/."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

# -----------------------------------------------------------------------------
# Dependencies (spec §8 whitelist).
#
# Layer 2.5 — sits between `bentodesk-widget` (layer 2) and `bentodesk-app`
# (layer 3) per master plan §1. Pulls only:
#   - `bentodesk-theme`       — to bridge themes::loader → ThemeTokens (T-085)
#   - `bentodesk-zone`        — for ZoneId in live_folder bindings (T-082)
#   - `windows-sys`            — plain Win32 surface (DWM / WinMsg / Shell)
#   - `windows`                — COM-typed OLE drag-drop (`#[implement]`)
#   - `crossbeam-channel`      — single-process event bus (replaces Tauri emit)
#   - `notify` 7               — file watcher (no debouncer; we hand-roll one)
#   - `serde` + `serde_json`   — ΔB ruling: derive on every public command
#                                 struct for forward-compat scripting hooks
#   - `tracing`                — diagnostics; subscriber lives in shell crate
#   - `smallvec`               — hot-path stack-inlined buffers (spec §10)
#   - `smol_str`               — hot-path strings (spec §10)
# -----------------------------------------------------------------------------
[dependencies]
bentodesk-theme  = { path = "../bentodesk-theme" }
bentodesk-zone   = { path = "../bentodesk-zone" }
bentodesk-style  = { path = "../bentodesk-style" }

windows-sys       = { workspace = true }
windows           = { workspace = true }
windows-core      = { workspace = true }
crossbeam-channel = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
zip               = { workspace = true }
minisign-verify   = { workspace = true }
tracing           = { workspace = true }
notify            = { workspace = true }
smallvec          = { workspace = true }
smol_str          = { workspace = true }

[lints]
workspace = true
