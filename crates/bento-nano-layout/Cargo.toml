[package]
name         = "bento-nano-layout"
description  = "Flexbox-lite layout engine for BentoDesk Nano."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bento-nano-tree  = { path = "../bento-nano-tree" }
bento-nano-style = { path = "../bento-nano-style" }
smallvec         = { workspace = true }
# `serde` (with `alloc`) is required to fix smol_str 0.3.6's serde impl when
# building this crate alone (`cargo build -p bento-nano-layout`). Transitively
# pulled via tree → smol_str/serde, which needs `serde_core`'s alloc-gated
# Visitor methods that only activate when serde itself has `alloc`. Identical
# fix applied to bento-nano-widget for the same reason.
serde            = { workspace = true }

[lints]
workspace = true
