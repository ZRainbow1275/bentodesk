[package]
name         = "bento-nano-zone"
description  = "Zone domain model (id, title, geometry) for BentoDesk Nano."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bento-nano-style = { path = "../bento-nano-style" }
smallvec         = { workspace = true }
# ΔB ruling (master-decomposition §11): every public type that participates in
# the dispatcher Command surface (ZoneId, WindowKind, …) derives serde traits
# even though the single-process build never serializes at runtime — preserves
# the v2.x scripting / plugin shape at zero runtime cost.
serde            = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
