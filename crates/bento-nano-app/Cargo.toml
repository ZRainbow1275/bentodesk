[package]
name         = "bento-nano-app"
description  = "Application state + event dispatcher + render orchestrator for BentoDesk Nano."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bento-nano-platform = { path = "../bento-nano-platform" }
bento-nano-tree     = { path = "../bento-nano-tree" }
bento-nano-style    = { path = "../bento-nano-style" }
bento-nano-layout   = { path = "../bento-nano-layout" }
bento-nano-widget   = { path = "../bento-nano-widget" }
bento-nano-theme    = { path = "../bento-nano-theme" }
bento-nano-zone     = { path = "../bento-nano-zone" }
# Wave-E business::timeline scaffold reads CheckpointMeta / DeltaSummary /
# DesktopSnapshot directly from the backend (T-089 + T-097, shipped). Direct
# dep keeps the Phase 1 single-process invariant (spec §2) — no IPC veneer.
bento-nano-backend  = { path = "../bento-nano-backend" }
smol_str            = { workspace = true }
smallvec            = { workspace = true }
crossbeam-channel   = { workspace = true }
# ΔB ruling (master-decomposition §11): every Command variant + payload type
# derives serde so the v2.x scripting/plugin shape is preserved at zero
# runtime cost. Single-process Phase 1 never serializes at runtime.
serde               = { workspace = true }
tracing             = { workspace = true }
windows             = { workspace = true }
windows-sys         = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
