[package]
name         = "bento-nano-widget"
description  = "Widget library (Container, Text, Image, Button) for BentoDesk Nano."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bento-nano-tree   = { path = "../bento-nano-tree" }
bento-nano-style  = { path = "../bento-nano-style" }
bento-nano-layout = { path = "../bento-nano-layout" }
bento-nano-theme  = { path = "../bento-nano-theme" }
smol_str          = { workspace = true }
smallvec          = { workspace = true }
# Required to force `serde`'s `alloc` feature on for single-crate `cargo build
# -p bento-nano-widget` (R9 mandate). Without this, `smol_str/serde` activates
# but `serde_core::de::Visitor`'s `visit_string`/`visit_byte_buf` (alloc-gated)
# are unavailable, breaking smol_str 0.3.6's serde impl. App / backend / shell
# pull `serde` with alloc directly so their single-crate builds already pass;
# widget didn't, hence the regression. Build-only proc-macro + zero runtime.
serde             = { workspace = true }

[lints]
workspace = true
