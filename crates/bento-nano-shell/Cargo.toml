[package]
name         = "bento-nano-shell"
description  = "BentoDesk native Windows desktop organizer."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
authors      = { workspace = true }

[dependencies]
bento-nano-platform = { path = "../bento-nano-platform" }
bento-nano-tree     = { path = "../bento-nano-tree" }
bento-nano-style    = { path = "../bento-nano-style" }
bento-nano-layout   = { path = "../bento-nano-layout" }
bento-nano-widget   = { path = "../bento-nano-widget" }
bento-nano-app      = { path = "../bento-nano-app" }
bento-nano-zone     = { path = "../bento-nano-zone" }
bento-nano-backend  = { path = "../bento-nano-backend" }
mimalloc            = { workspace = true }
smol_str            = { workspace = true }
smallvec            = { workspace = true }
crossbeam-channel   = { workspace = true }
windows-sys         = { workspace = true }
windows             = { workspace = true }
tracing             = { workspace = true }
# Context Capsule envelope persistence mirrors the 1.x JSON capsule metadata
# while keeping the selected-stack zones payload base64-encoded inside it.
serde               = { workspace = true }
serde_json          = { workspace = true }

[dev-dependencies]
zip = { workspace = true }

[[bin]]
name = "BentoDesk"
path = "src/main.rs"

[lints]
workspace = true
