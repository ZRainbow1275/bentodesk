name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Chinese or English is welcome. Early ideas can also start in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What desktop workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: The proposal keeps BentoDesk's native, local-first runtime boundary.
          required: true
