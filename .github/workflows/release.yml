name: Native Release

on:
  workflow_run:
    workflows:
      - Native CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag whose draft publication must be recovered
        required: true
        default: v2.0.3
        type: string
      sha:
        description: Exact main commit SHA already validated by Native CI
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: native-release-${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MSRV_TOOLCHAIN: "1.89.0"
  RUSTUP_TOOLCHAIN: "1.94.0"
  TARGET: x86_64-pc-windows-msvc

jobs:
  release:
    name: Build and publish portable package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}

      - name: Prepare Rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy --target $env:TARGET
          rustup toolchain install $env:MSRV_TOOLCHAIN --profile minimal --target $env:TARGET
          rustup show active-toolchain

      - name: Resolve release identity
        id: identity
        env:
          AUTOMATIC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTOMATIC_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AUTOMATIC_EVENT: ${{ github.event.workflow_run.event }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $shell = @($metadata.packages | Where-Object name -eq "bentodesk-shell")
          if ($shell.Count -ne 1) {
            throw "Expected exactly one bentodesk-shell package"
          }
          $version = $shell[0].version.ToString()
          $expectedTag = "v$version"
          $head = (git rev-parse HEAD).Trim()

          if ($env:GITHUB_EVENT_NAME -eq "workflow_run") {
            if (
              $env:AUTOMATIC_EVENT -ne "push" -or
              $env:AUTOMATIC_BRANCH -ne "main" -or
              $env:AUTOMATIC_CONCLUSION -ne "success"
            ) {
              throw "Automatic releases require a successful Native CI run on main"
            }
            if ($head -ne $env:AUTOMATIC_SHA) {
              throw "Checkout commit $head does not match successful CI commit $env:AUTOMATIC_SHA"
            }
            $currentVersion = [version]$version
            $parentCargo = (git show "${head}^:Cargo.toml") -join "`n"
            $parentMatch = [regex]::Match(
              $parentCargo,
              '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$'
            )
            if (-not $parentMatch.Success) {
              throw "Could not read the workspace version from the parent commit"
            }
            $parentVersion = [version]$parentMatch.Groups[1].Value
            if ($currentVersion -le $parentVersion) {
              throw "Workspace version $currentVersion must be newer than parent version $parentVersion"
            }
            $tag = $expectedTag
            $PSNativeCommandUseErrorActionPreference = $false
            git show-ref --verify --quiet "refs/tags/$tag"
            $tagExit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $true
            $global:LASTEXITCODE = 0
            if ($tagExit -eq 0) {
              throw "Release tag $tag already exists; every main commit must declare a new workspace version"
            } elseif ($tagExit -ne 1) {
              throw "Could not inspect tag $tag"
            }
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:DISPATCH_TAG.Trim()
            $dispatchSha = $env:DISPATCH_SHA
            if (-not $tag) {
              throw "workflow_dispatch requires an existing immutable tag"
            }
            if ($dispatchSha -notmatch '^[0-9a-f]{40}$' -or $dispatchSha -ne $head) {
              throw "Recovery SHA $dispatchSha does not match checkout commit $head"
            }
            if ($tag -ne $expectedTag) {
              throw "Tag $tag does not match workspace version $version"
            }

            $PSNativeCommandUseErrorActionPreference = $false
            git show-ref --verify --quiet "refs/tags/$tag"
            $tagExit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $true
            $global:LASTEXITCODE = 0
            if ($tagExit -ne 0) {
              throw "Recovery tag $tag does not exist in the checked-out repository"
            }
            if ((git cat-file -t "refs/tags/$tag").Trim() -ne "tag") {
              throw "Recovery tag $tag must be annotated"
            }
            $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim()
            if ($tagCommit -ne $head) {
              throw "Recovery tag $tag points to $tagCommit instead of checkout commit $head"
            }

            $runs = gh api `
              "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&branch=main&event=push&status=success&per_page=100" |
              ConvertFrom-Json
            $matchingRuns = @($runs.workflow_runs | Where-Object {
              $_.name -eq "Native CI" -and
              $_.event -eq "push" -and
              $_.head_branch -eq "main" -and
              $_.head_sha -eq $head -and
              $_.conclusion -eq "success"
            })
            if ($matchingRuns.Count -eq 0) {
              throw "Recovery commit $head has no successful Native CI push run on main"
            }
          } else {
            throw "Unsupported release event: $env:GITHUB_EVENT_NAME"
          }

          $notes = "docs/release-notes-$tag.md"
          if (-not (Test-Path $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release identity: $tag at $head"

      - name: Minimum supported Rust
        env:
          RUSTFLAGS: ""
        run: cargo +$env:MSRV_TOOLCHAIN check --locked --workspace --all-targets --target $env:TARGET

      - name: Remap build-machine paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = python -c "import json,tomllib; print(json.dumps(tomllib.load(open('.cargo/config.toml','rb'))['target']['x86_64-pc-windows-msvc']['rustflags']))"
          $rustflags = @()
          foreach ($flag in (ConvertFrom-Json -InputObject $config)) {
            $rustflags += [string]$flag
          }
          $rustflags += "--remap-path-prefix=$env:USERPROFILE=/_build/user"
          $rustflags += "--remap-path-prefix=$env:GITHUB_WORKSPACE=/_build/workspace"
          "RUSTFLAGS=$($rustflags -join ' ')" >> $env:GITHUB_ENV

      - name: Verify source
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --target $env:TARGET
          cargo clippy --locked --workspace --all-targets --target $env:TARGET -- -D warnings
          cargo doc --locked --workspace --no-deps --target $env:TARGET

      - name: Supply-chain checks
        env:
          RUSTFLAGS: ""
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --locked --version 0.19.4
          cargo install cargo-audit --locked --version 0.22.1
          cargo deny check
          cargo audit

      - name: Build and assemble package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.TrimStart("v")
          $packageName = "BentoDesk-$version-windows-x64-portable"
          $dist = Join-Path $PWD "dist"
          $stage = Join-Path $dist $packageName
          $zip = Join-Path $dist "$packageName.zip"
          $releaseSums = Join-Path $dist "SHA256SUMS.txt"

          cargo build --locked --release --target $env:TARGET -p bentodesk-shell --bin BentoDesk
          $exe = Get-Item "target/$env:TARGET/release/BentoDesk.exe"
          if ($exe.VersionInfo.FileVersion -ne "$version.0" -or $exe.VersionInfo.ProductVersion -ne $version) {
            throw "BentoDesk.exe metadata is $($exe.VersionInfo.FileVersion) / $($exe.VersionInfo.ProductVersion); expected $version.0 / $version"
          }
          $manifest = Get-Content "crates/bentodesk-shell/app.manifest" -Raw
          $resource = Get-Content "crates/bentodesk-shell/app.rc" -Raw
          $expectedManifestVersion = [regex]::Escape("$version.0")
          if ($manifest -notmatch "version=`"$expectedManifestVersion`"") {
            throw "app.manifest does not contain assembly version $version.0"
          }
          $resourceVersion = $version.Replace(".", ",")
          foreach ($expected in @(
            "FILEVERSION $resourceVersion,0",
            "PRODUCTVERSION $resourceVersion,0",
            "VALUE `"FileVersion`", `"$version.0\0`"",
            "VALUE `"ProductVersion`", `"$version\0`""
          )) {
            if ($resource.IndexOf($expected, [StringComparison]::Ordinal) -lt 0) {
              throw "app.rc does not contain expected version identity: $expected"
            }
          }
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          if ($binaryText.IndexOf("version=`"$version.0`"", [StringComparison]::Ordinal) -lt 0) {
            throw "BentoDesk.exe does not contain embedded assembly version $version.0"
          }
          foreach ($privatePath in @($env:USERPROFILE, $env:GITHUB_WORKSPACE)) {
            if ($privatePath -and $binaryText.IndexOf($privatePath, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "BentoDesk.exe contains a private build-machine path"
            }
          }
          $limit = [int64](2.5 * 1MB)
          if ($exe.Length -gt $limit) {
            throw "BentoDesk.exe is $($exe.Length) bytes; limit is $limit"
          }

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $payload = @(
            @{ Source = "target/$env:TARGET/release/BentoDesk.exe"; Target = "BentoDesk.exe" },
            @{ Source = "README.md"; Target = "README.md" },
            @{ Source = "README.zh-CN.md"; Target = "README.zh-CN.md" },
            @{ Source = "LICENSE"; Target = "LICENSE" }
          )
          foreach ($entry in $payload) {
            $target = Join-Path $stage $entry.Target
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            Copy-Item $entry.Source $target
          }

          $innerLines = foreach ($file in Get-ChildItem $stage -File | Sort-Object Name) {
            $name = $file.Name
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $stage "SHA256SUMS.txt"),
            $innerLines,
            [Text.UTF8Encoding]::new($false)
          )

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllLines(
            $releaseSums,
            @("$zipHash  $packageName.zip"),
            [Text.UTF8Encoding]::new($false)
          )

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksums=$releaseSums" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Verify package and extracted runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = "${{ steps.package.outputs.zip }}"
          $required = @(
            "BentoDesk.exe",
            "LICENSE",
            "README.md",
            "README.zh-CN.md",
            "SHA256SUMS.txt"
          )
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $actual = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          } finally {
            $archive.Dispose()
          }
          $missing = @($required | Where-Object { $_ -notin $actual })
          if ($missing.Count -ne 0) {
            throw "Package is missing required entries: $($missing -join ', ')"
          }
          $unexpected = @($actual | Where-Object { $_ -notin $required })
          if ($unexpected.Count -ne 0) {
            throw "Package contains unexpected entries: $($unexpected -join ', ')"
          }

          $extract = Join-Path $env:RUNNER_TEMP "bentodesk-release-extracted"
          $state = Join-Path $env:RUNNER_TEMP "bentodesk-release-state"
          $stdout = Join-Path $env:RUNNER_TEMP "bentodesk-release.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "bentodesk-release.stderr.log"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $sumLines = Get-Content (Join-Path $extract "SHA256SUMS.txt")
          $checksummed = @()
          foreach ($line in $sumLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Malformed checksum line: $line"
            }
            $name = $Matches[2].Replace("\", "/")
            if ($name -eq "SHA256SUMS.txt" -or $name -notin $required) {
              throw "Unexpected checksummed entry: $name"
            }
            if ($name -in $checksummed) {
              throw "Duplicate checksum entry: $name"
            }
            $checksummed += $name
            $actualHash = (Get-FileHash (Join-Path $extract $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $Matches[1]) {
              throw "Checksum mismatch for $name"
            }
          }
          $expectedChecksummed = @($required | Where-Object { $_ -ne "SHA256SUMS.txt" })
          if (@(Compare-Object ($expectedChecksummed | Sort-Object) ($checksummed | Sort-Object)).Count -ne 0) {
            throw "SHA256SUMS.txt does not cover the complete package payload"
          }

          Import-Module (Join-Path $PWD "tools/proof/ProofTools.psm1") -Force
          $exe = Join-Path $extract "BentoDesk.exe"
          $process = $null
          try {
            $process = Start-IsolatedBentoDesk `
              -Executable $exe `
              -WorkingDirectory $extract `
              -StateDirectory $state `
              -StdoutPath $stdout `
              -StderrPath $stderr
            $window = Wait-ProofWindow `
              -TargetProcessId $process.Id `
              -ClassName "BentoDeskShell" `
              -TimeoutMs 12000
            if (-not $window) {
              throw "Extracted BentoDesk did not create its native main window"
            }
            if (-not (Send-ProofQuitHotkey -Window $window)) {
              throw "Production quit hotkey could not be posted"
            }
            if (-not (Wait-ProofProcessExit -TargetProcessId $process.Id -TimeoutMs 8000)) {
              throw "Extracted BentoDesk did not exit through the production quit path"
            }
          } finally {
            if ($process -and (Get-Process -Id $process.Id -ErrorAction SilentlyContinue)) {
              Stop-ProofProcessExact -TargetProcessId $process.Id -Executable $exe | Out-Null
            }
          }

      - name: Create immutable release tag
        if: github.event_name == 'workflow_run'
        env:
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:AUTOMATIC_SHA) {
            throw "Checkout commit $head does not match successful CI commit $env:AUTOMATIC_SHA"
          }

          $version = $env:RELEASE_TAG.TrimStart("v")
          gh auth setup-git --hostname github.com
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $env:RELEASE_TAG $head --message "BentoDesk $version"
          git push origin "refs/tags/$env:RELEASE_TAG"

          $remote = @(git ls-remote origin "refs/tags/$env:RELEASE_TAG^{}")
          if ($remote.Count -ne 1) {
            throw "Could not read back annotated tag $env:RELEASE_TAG"
          }
          $remoteCommit = ($remote[0] -split '\s+')[0]
          if ($remoteCommit -ne $head) {
            throw "Remote tag $env:RELEASE_TAG points to $remoteCommit instead of $head"
          }
          Write-Host "Created immutable annotated tag $env:RELEASE_TAG at $head"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $zip = "${{ steps.package.outputs.zip }}"
          $checksums = "${{ steps.package.outputs.checksums }}"
          $version = $tag.TrimStart("v")
          $notes = "docs/release-notes-$tag.md"
          if (-not (Test-Path $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }
          $api = "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @(
            "Accept: application/vnd.github+json",
            "X-GitHub-Api-Version: 2026-03-10"
          )
          $releaseJson = gh api $api -H $headers[0] -H $headers[1] 2>$null
          $viewExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($viewExit -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.draft) {
              throw "Release $tag is already published; immutable assets are never overwritten"
            }
            if ($release.tag_name -ne $tag) {
              throw "Draft Release tag mismatch: $($release.tag_name)"
            }
          } elseif ($viewExit -eq 1) {
            gh release create $tag `
              --draft `
              --verify-tag `
              --title "BentoDesk $version" `
              --notes-file $notes `
              --repo $env:GITHUB_REPOSITORY
          } else {
            throw "Could not query release $tag"
          }

          gh release upload $tag $zip $checksums --clobber --repo $env:GITHUB_REPOSITORY

          $expectedAssets = @{}
          $expectedAssets[[IO.Path]::GetFileName($zip)] =
            "sha256:$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          $expectedAssets[[IO.Path]::GetFileName($checksums)] =
            "sha256:$((Get-FileHash $checksums -Algorithm SHA256).Hash.ToLowerInvariant())"
          $draft = gh api $api -H $headers[0] -H $headers[1] | ConvertFrom-Json
          if (-not $draft.draft) {
            throw "Release $tag must remain a draft until asset verification finishes"
          }
          $draftAssetNames = @($draft.assets | ForEach-Object name | Sort-Object)
          $expectedAssetNames = @($expectedAssets.Keys | Sort-Object)
          if (@(Compare-Object $expectedAssetNames $draftAssetNames).Count -ne 0) {
            throw "Draft Release $tag contains missing or unexpected assets"
          }
          foreach ($entry in $expectedAssets.GetEnumerator()) {
            $assets = @($draft.assets | Where-Object name -eq $entry.Key)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne $entry.Value) {
              throw "Draft asset digest mismatch for $($entry.Key)"
            }
          }

          gh release edit $tag --draft=false --repo $env:GITHUB_REPOSITORY

          $published = gh api $api -H $headers[0] -H $headers[1] | ConvertFrom-Json
          if ($published.draft -or -not $published.immutable -or $published.tag_name -ne $tag) {
            throw "Published Release $tag is not immutable or has the wrong identity"
          }
          $publishedAssetNames = @($published.assets | ForEach-Object name | Sort-Object)
          if (@(Compare-Object $expectedAssetNames $publishedAssetNames).Count -ne 0) {
            throw "Published Release $tag contains missing or unexpected assets"
          }
          foreach ($entry in $expectedAssets.GetEnumerator()) {
            $assets = @($published.assets | Where-Object name -eq $entry.Key)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne $entry.Value) {
              throw "Published asset digest mismatch for $($entry.Key)"
            }
          }
