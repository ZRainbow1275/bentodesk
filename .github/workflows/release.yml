name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to publish
        required: true
        default: v2.0.2
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MSRV_TOOLCHAIN: "1.89.0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RUSTUP_TOOLCHAIN: "1.94.0"
  TARGET: x86_64-pc-windows-msvc

jobs:
  release:
    name: Build and publish portable package
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Prepare Rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy --target $env:TARGET
          rustup toolchain install $env:MSRV_TOOLCHAIN --profile minimal --target $env:TARGET
          rustup show active-toolchain

      - name: Minimum supported Rust
        env:
          RUSTFLAGS: ""
        run: cargo +$env:MSRV_TOOLCHAIN check --locked --workspace --all-targets --target $env:TARGET

      - name: Remap build-machine paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = python -c "import json,tomllib; print(json.dumps(tomllib.load(open('.cargo/config.toml','rb'))['target']['x86_64-pc-windows-msvc']['rustflags']))"
          $rustflags = @()
          foreach ($flag in (ConvertFrom-Json -InputObject $config)) {
            $rustflags += [string]$flag
          }
          $rustflags += "--remap-path-prefix=$env:USERPROFILE=/_build/user"
          $rustflags += "--remap-path-prefix=$env:GITHUB_WORKSPACE=/_build/workspace"
          "RUSTFLAGS=$($rustflags -join ' ')" >> $env:GITHUB_ENV

      - name: Verify tag and source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $shell = $metadata.packages | Where-Object name -eq "bentodesk-shell"
          $expectedTag = "v$($shell.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match workspace version $($shell.version)"
          }

          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --target $env:TARGET
          cargo clippy --locked --workspace --all-targets --target $env:TARGET -- -D warnings
          cargo doc --locked --workspace --no-deps --target $env:TARGET

      - name: Supply-chain checks
        env:
          RUSTFLAGS: ""
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --locked --version 0.19.4
          cargo install cargo-audit --locked --version 0.22.1
          cargo deny check
          cargo audit

      - name: Build and assemble package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.TrimStart("v")
          $packageName = "BentoDesk-$version-windows-x64-portable"
          $dist = Join-Path $PWD "dist"
          $stage = Join-Path $dist $packageName
          $zip = Join-Path $dist "$packageName.zip"
          $releaseSums = Join-Path $dist "SHA256SUMS.txt"

          cargo build --locked --release --target $env:TARGET -p bentodesk-shell --bin BentoDesk
          $exe = Get-Item "target/$env:TARGET/release/BentoDesk.exe"
          if ($exe.VersionInfo.FileVersion -ne "$version.0" -or $exe.VersionInfo.ProductVersion -ne $version) {
            throw "BentoDesk.exe metadata is $($exe.VersionInfo.FileVersion) / $($exe.VersionInfo.ProductVersion); expected $version.0 / $version"
          }
          $manifest = Get-Content "crates/bentodesk-shell/app.manifest" -Raw
          $expectedManifestVersion = [regex]::Escape("$version.0")
          if ($manifest -notmatch "version=`"$expectedManifestVersion`"") {
            throw "app.manifest does not contain assembly version $version.0"
          }
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          if ($binaryText.IndexOf("version=`"$version.0`"", [StringComparison]::Ordinal) -lt 0) {
            throw "BentoDesk.exe does not contain embedded assembly version $version.0"
          }
          foreach ($privatePath in @($env:USERPROFILE, $env:GITHUB_WORKSPACE)) {
            if ($binaryText.IndexOf($privatePath, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "BentoDesk.exe contains a private build-machine path"
            }
          }

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $payload = @(
            @{ Source = "target/$env:TARGET/release/BentoDesk.exe"; Target = "BentoDesk.exe" },
            @{ Source = "README.md"; Target = "README.md" },
            @{ Source = "README.zh-CN.md"; Target = "README.zh-CN.md" },
            @{ Source = "CONTRIBUTING.md"; Target = "CONTRIBUTING.md" },
            @{ Source = "SECURITY.md"; Target = "SECURITY.md" },
            @{ Source = "LICENSE"; Target = "LICENSE" },
            @{ Source = "crates/bentodesk-app/assets/app-icon.png"; Target = "crates/bentodesk-app/assets/app-icon.png" },
            @{ Source = "docs/media/desktop-tour.mp4"; Target = "docs/media/desktop-tour.mp4" },
            @{ Source = "docs/media/desktop-tour.webp"; Target = "docs/media/desktop-tour.webp" },
            @{ Source = "docs/media/tibo-reset.webp"; Target = "docs/media/tibo-reset.webp" },
            @{ Source = "docs/media/zone-motion.webp"; Target = "docs/media/zone-motion.webp" },
            @{ Source = "docs/media/zone-motion.mp4"; Target = "docs/media/zone-motion.mp4" },
            @{ Source = "docs/images/zone-editor.png"; Target = "docs/images/zone-editor.png" },
            @{ Source = "docs/images/bulk-manager.png"; Target = "docs/images/bulk-manager.png" },
            @{ Source = "docs/images/theme-settings.png"; Target = "docs/images/theme-settings.png" }
          )
          foreach ($entry in $payload) {
            $target = Join-Path $stage $entry.Target
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            Copy-Item $entry.Source $target
          }

          $innerLines = foreach ($file in Get-ChildItem $stage -Recurse -File | Sort-Object FullName) {
            $name = [IO.Path]::GetRelativePath($stage, $file.FullName).Replace("\", "/")
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $stage "SHA256SUMS.txt"),
            $innerLines,
            [Text.UTF8Encoding]::new($false)
          )

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllLines(
            $releaseSums,
            @("$zipHash  $packageName.zip"),
            [Text.UTF8Encoding]::new($false)
          )

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksums=$releaseSums" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Verify package and extracted runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = "${{ steps.package.outputs.zip }}"
          $required = @(
            "BentoDesk.exe",
            "CONTRIBUTING.md",
            "LICENSE",
            "README.md",
            "README.zh-CN.md",
            "SECURITY.md",
            "SHA256SUMS.txt",
            "crates/bentodesk-app/assets/app-icon.png",
            "docs/images/bulk-manager.png",
            "docs/images/theme-settings.png",
            "docs/images/zone-editor.png",
            "docs/media/desktop-tour.mp4",
            "docs/media/desktop-tour.webp",
            "docs/media/tibo-reset.webp",
            "docs/media/zone-motion.mp4",
            "docs/media/zone-motion.webp"
          )
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $actual = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          } finally {
            $archive.Dispose()
          }
          $missing = @($required | Where-Object { $_ -notin $actual })
          if ($missing.Count -ne 0) {
            throw "Package is missing required entries: $($missing -join ', ')"
          }

          $extract = Join-Path $env:RUNNER_TEMP "bentodesk-release-extracted"
          $state = Join-Path $env:RUNNER_TEMP "bentodesk-release-state"
          $stdout = Join-Path $env:RUNNER_TEMP "bentodesk-release.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "bentodesk-release.stderr.log"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $sumLines = Get-Content (Join-Path $extract "SHA256SUMS.txt")
          foreach ($line in $sumLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Malformed checksum line: $line"
            }
            $actualHash = (Get-FileHash (Join-Path $extract $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $Matches[1]) {
              throw "Checksum mismatch for $($Matches[2])"
            }
          }

          Import-Module (Join-Path $PWD "tools/proof/ProofTools.psm1") -Force
          $exe = Join-Path $extract "BentoDesk.exe"
          $process = $null
          try {
            $process = Start-IsolatedBentoDesk `
              -Executable $exe `
              -WorkingDirectory $extract `
              -StateDirectory $state `
              -StdoutPath $stdout `
              -StderrPath $stderr
            $window = Wait-ProofWindow `
              -TargetProcessId $process.Id `
              -ClassName "BentoDeskShell" `
              -TimeoutMs 12000
            if (-not $window) {
              throw "Extracted BentoDesk did not create its native main window"
            }
            if (-not (Send-ProofQuitHotkey -Window $window)) {
              throw "Production quit hotkey could not be posted"
            }
            if (-not (Wait-ProofProcessExit -TargetProcessId $process.Id -TimeoutMs 8000)) {
              throw "Extracted BentoDesk did not exit through the production quit path"
            }
          } finally {
            if ($process -and (Get-Process -Id $process.Id -ErrorAction SilentlyContinue)) {
              Stop-ProofProcessExact -TargetProcessId $process.Id -Executable $exe | Out-Null
            }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $zip = "${{ steps.package.outputs.zip }}"
          $checksums = "${{ steps.package.outputs.checksums }}"
          $version = $tag.TrimStart("v")
          $notes = "docs/release-notes-$tag.md"
          if (-not (Test-Path $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $viewExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($viewExit -eq 0) {
            throw "Release $tag already exists; published assets are never overwritten"
          } elseif ($viewExit -eq 1) {
            gh release create $tag `
              --draft `
              --verify-tag `
              --title "BentoDesk $version" `
              --notes-file $notes `
              --repo $env:GITHUB_REPOSITORY
            gh release upload $tag $zip $checksums --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --draft=false --repo $env:GITHUB_REPOSITORY
          } else {
            throw "Could not query release $tag"
          }
