name: Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MSRV_TOOLCHAIN: "1.89.0"
  RUSTUP_TOOLCHAIN: "1.94.0"
  RUST_BACKTRACE: "1"
  TARGET: x86_64-pc-windows-msvc

jobs:
  verify:
    name: Format, test, audit, and build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Isolate BentoDesk test state
        shell: pwsh
        run: |
          $stateDir = Join-Path $env:RUNNER_TEMP 'bentodesk-test-state'
          "BENTODESK_STATE_DIR=$stateDir" >> $env:GITHUB_ENV

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify installer lifecycle safety guard
        shell: pwsh
        run: |
          $expected = "Installer lifecycle testing requires -GitHubHostedWindowsRunner on a GitHub-hosted Windows runner"
          try {
            & "tools/release/Test-InstallerLifecycle.ps1" `
              -SetupPath (Join-Path $env:RUNNER_TEMP "missing-setup.exe") `
              -ExpectedVersion "0.0.0"
            throw "Installer lifecycle safety guard was bypassed"
          } catch {
            if ($_.Exception.Message -cne $expected) { throw }
          }

      - name: Prepare Rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy --target $env:TARGET
          rustup toolchain install $env:MSRV_TOOLCHAIN --profile minimal --target $env:TARGET
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Prepare NSIS
        uses: ./.github/actions/setup-nsis

      - name: Verify release version availability
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          function Compare-StableSemver([string]$Left, [string]$Right) {
            $pattern = '\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z'
            if ($Left -cnotmatch $pattern -or $Right -cnotmatch $pattern) {
              throw "Invalid stable semantic version comparison: $Left / $Right"
            }
            $leftParts = $Left.Split(".")
            $rightParts = $Right.Split(".")
            foreach ($index in 0..2) {
              $comparison = $leftParts[$index].Length.CompareTo($rightParts[$index].Length)
              if ($comparison -ceq 0) {
                $comparison = [string]::CompareOrdinal($leftParts[$index], $rightParts[$index])
              }
              if ($comparison -cne 0) {
                return $comparison
              }
            }
            return 0
          }

          function Test-ReleaseUnblockDiff([string]$From, [string]$To) {
            $expectedBase = "1852462f403c47ee581c9b47bbcbeded7c7d2225"
            $expectedPaths = @(
              ".github/actions/setup-nsis/action.yml"
              ".github/workflows/ci.yml"
              ".github/workflows/release.yml"
            )
            if ((git rev-parse $From).Trim() -cne $expectedBase) {
              return $false
            }
            $actualPaths = @(git diff --name-only $From $To --)
            return (
              $actualPaths.Count -ceq $expectedPaths.Count -and
              @(Compare-Object $expectedPaths $actualPaths -CaseSensitive).Count -ceq 0
            )
          }

          $releaseUnblockPreviousVersion = "2.0.10"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $shell = @($metadata.packages | Where-Object name -ceq "bentodesk-shell")
          if ($shell.Count -cne 1) {
            throw "Expected exactly one bentodesk-shell package"
          }
          $tag = "v$($shell[0].version)"
          $head = (git rev-parse HEAD).Trim()
          $currentVersion = $shell[0].version.ToString()

          $PSNativeCommandUseErrorActionPreference = $false
          git show-ref --verify --quiet "refs/tags/$tag"
          $tagExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          $global:LASTEXITCODE = 0
          if ($tagExit -cnotin @(0, 1)) {
            throw "Could not inspect tag $tag"
          }

          if ($env:GITHUB_EVENT_NAME -ceq "pull_request") {
            if ($tagExit -ceq 0) {
              throw "Workspace version $($shell[0].version) is already published as $tag; pull requests must declare an unused version"
            }
            $baseCargo = (git show "origin/$($env:GITHUB_BASE_REF):Cargo.toml") -join "`n"
            $baseMatch = [regex]::Match(
              $baseCargo,
              '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$'
            )
            if (-not $baseMatch.Success) {
              throw "Could not read the workspace version from the pull-request base"
            }
            $baseVersion = $baseMatch.Groups[1].Value
            $comparison = Compare-StableSemver $currentVersion $baseVersion
            if ($comparison -lt 0) {
              throw "Workspace version $currentVersion must be newer than base version $baseVersion"
            } elseif ($comparison -eq 0) {
              if (-not (Test-ReleaseUnblockDiff $env:PR_BASE_SHA $env:PR_HEAD_SHA)) {
                throw "Version $currentVersion may match the base only for the exact 2.1.0 release-unblock diff"
              }
              $previousVersion = $releaseUnblockPreviousVersion
              Write-Host "Approved exact 2.1.0 release-unblock pull request"
            } else {
              $previousVersion = $baseVersion
            }
            Write-Host "Unused pull-request release tag: $tag"
          } elseif ($env:GITHUB_EVENT_NAME -ceq "push") {
            $parentCargo = (git show "${head}^:Cargo.toml") -join "`n"
            $parentMatch = [regex]::Match(
              $parentCargo,
              '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$'
            )
            if (-not $parentMatch.Success) {
              throw "Could not read the workspace version from the parent commit"
            }
            $parentVersion = $parentMatch.Groups[1].Value
            $comparison = Compare-StableSemver $currentVersion $parentVersion
            if ($comparison -lt 0) {
              throw "Workspace version $currentVersion must be newer than parent version $parentVersion"
            } elseif ($comparison -eq 0) {
              if (
                $tagExit -cne 1 -or
                -not (Test-ReleaseUnblockDiff "${head}^" $head)
              ) {
                throw "Version $currentVersion may match its parent only for the unpublished exact 2.1.0 release-unblock commit"
              }
              $previousVersion = $releaseUnblockPreviousVersion
              Write-Host "Approved exact 2.1.0 release-unblock main commit"
            } else {
              $previousVersion = $parentVersion
            }
            if ($tagExit -ceq 1) {
              Write-Host "Release tag $tag is available for this main commit"
            } else {
              $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim()
              if ($tagCommit -cne $head) {
                throw "Release tag $tag points to $tagCommit instead of current main commit $head"
              }
              Write-Host "Release tag $tag already points to this main commit"
            }
          } else {
            throw "Unsupported CI event: $env:GITHUB_EVENT_NAME"
          }
          "PREVIOUS_VERSION=$previousVersion" >> $env:GITHUB_ENV

      - name: Minimum supported Rust
        env:
          RUSTFLAGS: ""
        run: cargo +$env:MSRV_TOOLCHAIN check --locked --workspace --all-targets --target $env:TARGET

      - name: Remap build-machine paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = python -c "import json,tomllib; print(json.dumps(tomllib.load(open('.cargo/config.toml','rb'))['target']['x86_64-pc-windows-msvc']['rustflags']))"
          $rustflags = @()
          foreach ($flag in (ConvertFrom-Json -InputObject $config)) {
            $rustflags += [string]$flag
          }
          $rustflags += "--remap-path-prefix=$env:USERPROFILE=/_build/user"
          $rustflags += "--remap-path-prefix=$env:GITHUB_WORKSPACE=/_build/workspace"
          "RUSTFLAGS=$($rustflags -join ' ')" >> $env:GITHUB_ENV

      - name: Verify repository boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tracked = @(git ls-files | Where-Object { Test-Path $_ -PathType Leaf })
          $generated = @($tracked | Where-Object {
            $_ -match '^(artifacts|dist|target)/' -or
            $_ -match '^runtime-proof-' -or
            $_ -match '(^|/)(handtest|manual-test|runtime-(diagnostic|reference|screen))-'
          })
          if ($generated.Count -cne 0) {
            throw "Generated runtime files are tracked:`n$($generated -join "`n")"
          }

          $PSNativeCommandUseErrorActionPreference = $false
          $pathCandidates = @(git grep -n -I -E '([A-Za-z]:[/\\](Users|Desktop)[/\\])' -- .)
          $grepExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          $fixtureUserPath = 'C:[/\\]Users[/\\](BentoDeskTest|Alice|Bob|Test|Public|X1?|Desktop|\.{3})([/\\]|"|$)'
          $localPathHits = @($pathCandidates | Where-Object {
            $_ -notmatch $fixtureUserPath -and
            $_ -notmatch 'C:[/\\]Desktop[/\\]'
          })
          if ($localPathHits.Count -cne 0) {
            throw "Machine-local paths are tracked:`n$($localPathHits -join "`n")"
          }
          if ($grepExit -cnotin @(0, 1)) {
            throw "git grep failed with exit code $grepExit"
          }
          $global:LASTEXITCODE = 0

          $oversized = @(
            Get-ChildItem crates -Recurse -Filter *.rs -File |
              ForEach-Object {
                $lines = [IO.File]::ReadAllLines($_.FullName).Length
                if ($lines -gt 800) {
                  [pscustomobject]@{ Path = $_.FullName; Lines = $lines }
                }
              }
          )
          if ($oversized.Count -cne 0) {
            throw "Rust modules over 800 lines:`n$($oversized | Format-Table | Out-String)"
          }

          $mainLines = [IO.File]::ReadAllLines(
            (Resolve-Path "crates/bentodesk-shell/src/main.rs")
          ).Length
          if ($mainLines -gt 800) {
            throw "main.rs has $mainLines lines; limit is 800"
          }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked --workspace --all-targets --target $env:TARGET

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target $env:TARGET -- -D warnings

      - name: Documentation
        run: cargo doc --locked --workspace --no-deps --target $env:TARGET

      - name: Install supply-chain tools
        env:
          RUSTFLAGS: ""
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --locked --version 0.19.4
          cargo install cargo-audit --locked --version 0.22.1

      - name: Supply-chain checks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo deny check
          cargo audit

          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          $packageNames = @($metadata.packages | ForEach-Object name | Sort-Object -Unique)
          $forbidden = @(
            "async-std", "dioxus-desktop", "egui", "electron", "floem",
            "iced", "slint", "tauri", "tokio", "webview2-com", "wry", "xilem"
          )
          foreach ($name in $forbidden) {
            if ($packageNames -contains $name) {
              throw "Forbidden runtime dependency found: $name"
            }
          }

      - name: Release build and identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          cargo build --locked --release --target $env:TARGET -p bentodesk-shell --bin BentoDesk
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -ceq "bentodesk-shell").version.ToString()
          $manifest = Get-Content "crates/bentodesk-shell/app.manifest" -Raw
          $resource = Get-Content "crates/bentodesk-shell/app.rc" -Raw
          $expectedManifestVersion = [regex]::Escape("$version.0")
          if ($manifest -cnotmatch "version=`"$expectedManifestVersion`"") {
            throw "app.manifest does not contain assembly version $version.0"
          }
          $resourceVersion = $version.Replace(".", ",")
          foreach ($expected in @(
            "FILEVERSION $resourceVersion,0",
            "PRODUCTVERSION $resourceVersion,0",
            "VALUE `"FileVersion`", `"$version.0\0`"",
            "VALUE `"ProductVersion`", `"$version\0`""
          )) {
            if ($resource.IndexOf($expected, [StringComparison]::Ordinal) -lt 0) {
              throw "app.rc does not contain expected version identity: $expected"
            }
          }
          $exe = Get-Item "target/$env:TARGET/release/BentoDesk.exe"
          if ($exe.VersionInfo.FileVersion -cne "$version.0" -or $exe.VersionInfo.ProductVersion -cne $version) {
            throw "BentoDesk.exe metadata is $($exe.VersionInfo.FileVersion) / $($exe.VersionInfo.ProductVersion); expected $version.0 / $version"
          }
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          if ($binaryText.IndexOf("version=`"$version.0`"", [StringComparison]::Ordinal) -lt 0) {
            throw "BentoDesk.exe does not contain embedded assembly version $version.0"
          }
          foreach ($privatePath in @($env:USERPROFILE, $env:GITHUB_WORKSPACE)) {
            if ($privatePath -and $binaryText.IndexOf($privatePath, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "BentoDesk.exe contains a private build-machine path"
            }
          }
          $limit = [int64](2.5 * 1MB)
          if ($exe.Length -gt $limit) {
            throw "BentoDesk.exe is $($exe.Length) bytes; limit is $limit"
          }

          $setup = Join-Path $env:RUNNER_TEMP "BentoDesk-$version-windows-x64-setup.exe"
          $previousSetup = Join-Path $env:RUNNER_TEMP "BentoDesk-$env:PREVIOUS_VERSION-upgrade-fixture-setup.exe"
          & "tools/release/Build-Installer.ps1" `
            -Version $version `
            -AppExe $exe.FullName `
            -OutputPath $setup
          & "tools/release/Get-PreviousSetup.ps1" `
            -Repository $env:GITHUB_REPOSITORY `
            -PreviousVersion $env:PREVIOUS_VERSION `
            -OutputPath $previousSetup
          & "tools/release/Test-InstallerLifecycle.ps1" `
            -GitHubHostedWindowsRunner `
            -SetupPath $setup `
            -ExpectedVersion $version `
            -PreviousSetupPath $previousSetup

          Write-Host "BentoDesk.exe: $($exe.Length) bytes"
          Write-Host "SHA-256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
