name: Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MSRV_TOOLCHAIN: "1.89.0"
  RUSTUP_TOOLCHAIN: "1.94.0"
  RUST_BACKTRACE: "1"
  TARGET: x86_64-pc-windows-msvc

jobs:
  verify:
    name: Format, test, audit, and build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy --target $env:TARGET
          rustup toolchain install $env:MSRV_TOOLCHAIN --profile minimal --target $env:TARGET
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Minimum supported Rust
        env:
          RUSTFLAGS: ""
        run: cargo +$env:MSRV_TOOLCHAIN check --locked --workspace --all-targets --target $env:TARGET

      - name: Remap build-machine paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = python -c "import json,tomllib; print(json.dumps(tomllib.load(open('.cargo/config.toml','rb'))['target']['x86_64-pc-windows-msvc']['rustflags']))"
          $rustflags = @()
          foreach ($flag in (ConvertFrom-Json -InputObject $config)) {
            $rustflags += [string]$flag
          }
          $rustflags += "--remap-path-prefix=$env:USERPROFILE=/_build/user"
          $rustflags += "--remap-path-prefix=$env:GITHUB_WORKSPACE=/_build/workspace"
          "RUSTFLAGS=$($rustflags -join ' ')" >> $env:GITHUB_ENV

      - name: Verify repository boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tracked = @(git ls-files | Where-Object { Test-Path $_ -PathType Leaf })
          $generated = @($tracked | Where-Object {
            $_ -match '^(artifacts|dist|target)/' -or
            $_ -match '^runtime-proof-' -or
            $_ -match '(^|/)(handtest|manual-test|runtime-(diagnostic|reference|screen))-'
          })
          if ($generated.Count -ne 0) {
            throw "Generated runtime files are tracked:`n$($generated -join "`n")"
          }

          $PSNativeCommandUseErrorActionPreference = $false
          $pathCandidates = @(git grep -n -I -E '([A-Za-z]:[/\\](Users|Desktop)[/\\])' -- .)
          $grepExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          $fixtureUserPath = 'C:[/\\]Users[/\\](BentoDeskTest|Alice|Bob|Test|Public|X1?|Desktop|\.{3})([/\\]|"|$)'
          $localPathHits = @($pathCandidates | Where-Object {
            $_ -notmatch $fixtureUserPath -and
            $_ -notmatch 'C:[/\\]Desktop[/\\]'
          })
          if ($localPathHits.Count -ne 0) {
            throw "Machine-local paths are tracked:`n$($localPathHits -join "`n")"
          }
          if ($grepExit -notin @(0, 1)) {
            throw "git grep failed with exit code $grepExit"
          }
          $global:LASTEXITCODE = 0

          $oversized = @(
            Get-ChildItem crates -Recurse -Filter *.rs -File |
              ForEach-Object {
                $lines = [IO.File]::ReadAllLines($_.FullName).Length
                if ($lines -gt 800) {
                  [pscustomobject]@{ Path = $_.FullName; Lines = $lines }
                }
              }
          )
          if ($oversized.Count -ne 0) {
            throw "Rust modules over 800 lines:`n$($oversized | Format-Table | Out-String)"
          }

          $mainLines = [IO.File]::ReadAllLines(
            (Resolve-Path "crates/bentodesk-shell/src/main.rs")
          ).Length
          if ($mainLines -gt 800) {
            throw "main.rs has $mainLines lines; limit is 800"
          }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked --workspace --all-targets --target $env:TARGET

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target $env:TARGET -- -D warnings

      - name: Documentation
        run: cargo doc --locked --workspace --no-deps --target $env:TARGET

      - name: Install supply-chain tools
        env:
          RUSTFLAGS: ""
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --locked --version 0.19.4
          cargo install cargo-audit --locked --version 0.22.1

      - name: Supply-chain checks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo deny check
          cargo audit

          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          $packageNames = @($metadata.packages | ForEach-Object name | Sort-Object -Unique)
          $forbidden = @(
            "async-std", "dioxus-desktop", "egui", "electron", "floem",
            "iced", "slint", "tauri", "tokio", "webview2-com", "wry", "xilem"
          )
          foreach ($name in $forbidden) {
            if ($packageNames -contains $name) {
              throw "Forbidden runtime dependency found: $name"
            }
          }

      - name: Release build and identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          cargo build --locked --release --target $env:TARGET -p bentodesk-shell --bin BentoDesk
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "bentodesk-shell").version.ToString()
          $manifest = Get-Content "crates/bentodesk-shell/app.manifest" -Raw
          $expectedManifestVersion = [regex]::Escape("$version.0")
          if ($manifest -notmatch "version=`"$expectedManifestVersion`"") {
            throw "app.manifest does not contain assembly version $version.0"
          }
          $exe = Get-Item "target/$env:TARGET/release/BentoDesk.exe"
          if ($exe.VersionInfo.FileVersion -ne "$version.0" -or $exe.VersionInfo.ProductVersion -ne $version) {
            throw "BentoDesk.exe metadata is $($exe.VersionInfo.FileVersion) / $($exe.VersionInfo.ProductVersion); expected $version.0 / $version"
          }
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          if ($binaryText.IndexOf("version=`"$version.0`"", [StringComparison]::Ordinal) -lt 0) {
            throw "BentoDesk.exe does not contain embedded assembly version $version.0"
          }
          foreach ($privatePath in @($env:USERPROFILE, $env:GITHUB_WORKSPACE)) {
            if ($binaryText.IndexOf($privatePath, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "BentoDesk.exe contains a private build-machine path"
            }
          }
          $limit = [int64](2.5 * 1MB)
          if ($exe.Length -gt $limit) {
            throw "BentoDesk.exe is $($exe.Length) bytes; limit is $limit"
          }
          Write-Host "BentoDesk.exe: $($exe.Length) bytes"
          Write-Host "SHA-256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
