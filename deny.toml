[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# Internal path dependencies intentionally inherit the workspace version and
# are fully locked by Cargo.lock. External registry dependencies remain pinned
# by their explicit workspace requirements.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = [
    "async-std",
    "dioxus-desktop",
    "egui",
    "electron",
    "floem",
    "iced",
    "slint",
    "tauri",
    "tokio",
    "webview2-com",
    "wry",
    "xilem",
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
